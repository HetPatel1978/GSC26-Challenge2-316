name: Triage New Issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label-by-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check for bug keyword
        run: |
          echo "Processing issue: ${{ github.event.issue.title }}"
          if [[ "${{ github.event.issue.title }}" == *"[BUG]"* ]]; then
            echo "bug-detected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply label
        if: steps.check.outputs.bug-detected == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --add-label bug
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
