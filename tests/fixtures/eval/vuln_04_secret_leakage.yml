name: Deploy to Staging
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
      - name: Build artifact
        run: npm ci && npm run build
      - name: Deploy
        run: |
          echo "Deploying with token ${{ secrets.DEPLOY_TOKEN }}"
          curl -X POST https://deploy.example.com/hooks \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
