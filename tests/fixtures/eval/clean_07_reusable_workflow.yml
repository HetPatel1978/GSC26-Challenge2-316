name: Reusable Test Workflow
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
      - uses: actions/setup-python@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests/
