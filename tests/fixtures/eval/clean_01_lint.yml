name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install ruff black mypy
      - name: Run ruff
        run: ruff check .
      - name: Run black --check
        run: black --check .
      - name: Run mypy
        run: mypy src/
