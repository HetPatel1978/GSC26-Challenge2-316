name: Publish Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
      - uses: actions/setup-python@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
