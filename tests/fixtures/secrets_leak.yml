name: Secrets Leak Example
on: push
jobs:
  hardcoded:
    runs-on: ubuntu-latest
    steps:
      - env:
          AWS_KEY: AKIAABCDEFGHIJKLMNOP
        run: echo "configured"
  echoed:
    runs-on: ubuntu-latest
    steps:
      - run: echo "token is ${{ secrets.DEPLOY_TOKEN }}"
  inline-no-echo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" https://api.example.com
  url-basic-auth:
    runs-on: ubuntu-latest
    steps:
      - run: git clone https://user:${{ secrets.DEPLOY_TOKEN }}@example.com/repo.git
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -H "Authorization: token $DEPLOY_TOKEN" https://api.example.com
